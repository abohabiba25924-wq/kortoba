<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة قرطبة لمتابعة الحفظ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F1E8;
    --panel:#FFFFFF;
    --ink:#16241D;
    --ink-soft:#5B6B62;
    --green:#0F3D28;
    --green-deep:#082A1C;
    --green-mid:#1C5940;
    --gold:#B9832A;
    --gold-bright:#D89518;
    --line:rgba(15,61,40,0.12);
    --success:#1F7A52;
    --success-bg:#E6F2EC;
    --warn:#B9832A;
    --warn-bg:#FBF2E1;
    --danger:#B23B2E;
    --danger-bg:#FBEAE7;
    --radius:16px;
    --shadow:0 16px 34px -18px rgba(8,42,28,0.35);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',sans-serif;line-height:1.7;}
  a{color:inherit;text-decoration:none;}
  ul{margin:0;padding:0;list-style:none;}
  button,input,select,textarea{font-family:'Cairo',sans-serif;}
  img{max-width:100%;display:block;}
  .hidden{display:none !important;}

  /* ---------------- LOGIN ---------------- */
  #loginScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(185,131,42,0.14), transparent 60%),
      radial-gradient(800px 500px at 10% 110%, rgba(15,61,40,0.12), transparent 60%),
      var(--bg);
    padding:24px;
  }
  .login-card{
    width:100%;max-width:420px;background:var(--panel);border-radius:24px;
    box-shadow:var(--shadow);padding:40px 36px;border:1px solid var(--line);
  }
  .login-logo{width:64px;height:64px;object-fit:contain;margin:0 auto 14px;}
  .login-card h1{
    font-family:'Amiri',serif;text-align:center;font-size:22px;color:var(--green-deep);margin:0 0 4px;
  }
  .login-card .sub{text-align:center;color:var(--ink-soft);font-size:13.5px;margin-bottom:28px;}
  .field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;}
  .field label{font-size:13px;font-weight:700;color:var(--green-deep);}
  .field input,.field select{
    border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;font-size:14.5px;
    background:var(--bg);color:var(--ink);outline:none;transition:border-color .2s ease, box-shadow .2s ease;
  }
  .field input:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(15,61,40,0.1);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 20px;border-radius:12px;font-weight:700;font-size:14.5px;border:none;cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn-primary{background:var(--green);color:#fff;width:100%;box-shadow:0 12px 26px -12px rgba(15,61,40,0.55);}
  .btn-primary:hover{background:var(--green-mid);transform:translateY(-1px);}
  .login-divider{display:flex;align-items:center;gap:12px;margin:26px 0 18px;color:var(--ink-soft);font-size:12.5px;}
  .login-divider::before,.login-divider::after{content:"";flex:1;height:1px;background:var(--line);}
  .demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .demo-btn{
    border:1.5px dashed var(--line);background:var(--bg);border-radius:11px;padding:10px;
    font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;transition:all .2s ease;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .demo-btn:hover{border-color:var(--gold);color:var(--green-deep);background:#fff;}
  .login-note{margin-top:20px;font-size:11.5px;color:var(--ink-soft);text-align:center;}

  /* ---------------- APP SHELL ---------------- */
  #app{display:none;min-height:100vh;}
  #app.active{display:flex;}
  .sidebar{
    width:250px;flex:none;background:var(--green-deep);color:rgba(244,241,232,0.85);
    display:flex;flex-direction:column;padding:24px 18px;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .sidebar-brand{display:flex;align-items:center;gap:10px;padding:0 6px 24px;border-bottom:1px solid rgba(244,241,232,0.12);margin-bottom:20px;}
  .sidebar-brand img{width:36px;height:36px;object-fit:contain;}
  .sidebar-brand strong{display:block;color:#fff;font-family:'Amiri',serif;font-size:16.5px;}
  .sidebar-brand span{display:block;font-size:11px;color:var(--gold-bright);}
  .side-role{
    font-size:11.5px;font-weight:700;letter-spacing:0.5px;color:rgba(244,241,232,0.5);
    text-transform:uppercase;margin:6px 10px 10px;
  }
  .side-nav{display:flex;flex-direction:column;gap:4px;flex:1;}
  .side-link{
    display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;
    font-size:14.5px;font-weight:600;color:rgba(244,241,232,0.75);cursor:pointer;transition:all .18s ease;
  }
  .side-link svg{width:18px;height:18px;flex:none;stroke:currentColor;}
  .side-link:hover{background:rgba(244,241,232,0.06);color:#fff;}
  .side-link.active{background:var(--gold);color:var(--green-deep);}
  .sidebar-user{
    display:flex;align-items:center;gap:10px;padding:14px 10px;border-top:1px solid rgba(244,241,232,0.12);margin-top:12px;
  }
  .sidebar-user .avatar{
    width:36px;height:36px;border-radius:50%;background:linear-gradient(145deg,var(--gold),var(--gold-bright));
    display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--green-deep);font-size:13.5px;flex:none;
  }
  .sidebar-user .who{flex:1;min-width:0;}
  .sidebar-user .who strong{display:block;font-size:13.5px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sidebar-user .who span{font-size:11.5px;color:rgba(244,241,232,0.55);}
  .logout-btn{background:none;border:none;color:rgba(244,241,232,0.55);cursor:pointer;padding:6px;flex:none;}
  .logout-btn:hover{color:var(--gold-bright);}
  .logout-btn svg{width:18px;height:18px;stroke:currentColor;}

  .main{flex:1;min-width:0;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 32px;background:var(--panel);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:5;
  }
  .topbar h2{font-family:'Amiri',serif;font-size:22px;color:var(--green-deep);}
  .topbar .date-pill{
    font-size:13px;font-weight:600;color:var(--ink-soft);background:var(--bg);
    padding:8px 16px;border-radius:100px;border:1px solid var(--line);
  }
  .content{padding:32px;max-width:1280px;}

  .page{display:none;}
  .page.active{display:block;}

  /* stat cards */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:32px;}
  .stat-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;
    display:flex;flex-direction:column;gap:10px;
  }
  .stat-card .icon{
    width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(145deg,var(--green),var(--green-mid));
  }
  .stat-card .icon svg{width:20px;height:20px;stroke:#fff;}
  .stat-card .num{font-family:'Amiri',serif;font-size:28px;color:var(--green-deep);font-weight:700;}
  .stat-card .lbl{font-size:13px;color:var(--ink-soft);font-weight:600;}

  /* panel / table */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px;margin-bottom:24px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .panel-head h3{font-family:'Amiri',serif;font-size:18px;color:var(--green-deep);}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  thead th{
    text-align:right;font-size:12.5px;color:var(--ink-soft);font-weight:700;padding:0 12px 12px;
    border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:0.3px;
  }
  tbody td{padding:14px 12px;border-bottom:1px solid var(--line);color:var(--ink);}
  tbody tr:last-child td{border-bottom:none;}
  .cell-name{display:flex;align-items:center;gap:10px;font-weight:600;}
  .cell-name .avatar-sm{
    width:32px;height:32px;border-radius:50%;background:var(--bg);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--green-deep);
  }
  .badge{
    display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:100px;font-size:12.5px;font-weight:700;
  }
  .badge-success{background:var(--success-bg);color:var(--success);}
  .badge-warn{background:var(--warn-bg);color:var(--warn);}
  .badge-danger{background:var(--danger-bg);color:var(--danger);}
  .row-actions{display:flex;gap:8px;}
  .icon-btn{
    width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--bg);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s ease;
  }
  .icon-btn:hover{border-color:var(--green);background:#fff;}
  .icon-btn svg{width:16px;height:16px;stroke:var(--green-deep);}

  .note-banner{
    display:flex;align-items:center;gap:10px;background:var(--warn-bg);color:#8A611E;
    border:1px solid rgba(185,131,42,0.3);padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;margin-bottom:24px;
  }

  /* progress ring */
  .ring-wrap{display:flex;align-items:center;gap:24px;}
  .ring{position:relative;width:130px;height:130px;flex:none;}
  .ring svg{transform:rotate(-90deg);width:100%;height:100%;}
  .ring .ring-label{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .ring .ring-label b{font-family:'Amiri',serif;font-size:24px;color:var(--green-deep);}
  .ring .ring-label span{font-size:11.5px;color:var(--ink-soft);}

  /* two-col layout */
  .cols-2{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:start;}

  /* ward card (student) */
  .ward-card{
    background:linear-gradient(135deg,var(--green-deep),var(--green));
    color:#fff;border-radius:20px;padding:30px;position:relative;overflow:hidden;
  }
  .ward-card::before{content:"";position:absolute;inset:0;background:radial-gradient(300px 200px at 100% 0%, rgba(216,149,24,0.25), transparent 60%);}
  .ward-card .tag{position:relative;font-size:12.5px;font-weight:700;color:var(--gold-bright);margin-bottom:10px;display:block;}
  .ward-card h3{position:relative;font-family:'Amiri',serif;font-size:26px;margin:0 0 6px;}
  .ward-card p{position:relative;color:rgba(244,241,232,0.8);font-size:14px;margin:0 0 18px;}
  .ward-meta{position:relative;display:flex;gap:22px;flex-wrap:wrap;}
  .ward-meta div{font-size:13px;color:rgba(244,241,232,0.65);}
  .ward-meta b{display:block;color:#fff;font-size:15px;font-family:'Amiri',serif;}

  .session-item{
    display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;
  }
  .session-item:last-child{margin-bottom:0;}
  .session-date{
    width:52px;height:52px;border-radius:12px;background:var(--bg);flex:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .session-date b{font-size:17px;color:var(--green-deep);font-family:'Amiri',serif;}
  .session-date span{font-size:10.5px;color:var(--ink-soft);}
  .session-info{flex:1;min-width:0;}
  .session-info strong{display:block;font-size:14.5px;}
  .session-info span{font-size:12.5px;color:var(--ink-soft);}
  .session-join{
    display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:100px;
    background:var(--success);color:#fff;font-size:13px;font-weight:700;flex:none;
  }
  .session-join.disabled{background:var(--bg);color:var(--ink-soft);border:1px solid var(--line);}

  /* modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(8,42,28,0.45);display:none;align-items:center;justify-content:center;
    z-index:100;padding:20px;
  }
  .modal-overlay.active{display:flex;}
  .modal{background:#fff;border-radius:20px;padding:30px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;}
  .modal h3{font-family:'Amiri',serif;color:var(--green-deep);margin:0 0 18px;font-size:19px;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .btn-ghost{background:var(--bg);color:var(--ink-soft);flex:1;border:1px solid var(--line);}
  .btn-ghost:hover{background:#eee;}

  @media (max-width:960px){
    .sidebar{position:fixed;right:0;top:0;z-index:40;transform:translateX(100%);transition:transform .25s ease;}
    .sidebar.open{transform:translateX(0);}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .cols-2{grid-template-columns:1fr;}
    .content{padding:20px;}
    .topbar{padding:16px 20px;}
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="login-card">
    <img class="login-logo" src="https://res.cloudinary.com/dvfx83gns/image/upload/v1787795512/%D9%82%D8%B1%D8%B7%D8%A8%D8%A9_gbn7xe.png" alt="قرطبة">
    <h1>منصة قرطبة لمتابعة الحفظ</h1>
    <p class="sub">سجّل دخولك لمتابعة الورد والتقدم والحصص</p>

    <form id="loginForm">
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="loginEmail" placeholder="example@kortoba.com" required>
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary">دخول</button>
    </form>

    <div class="login-divider">أو جرّب دخول تجريبي سريع</div>
    <div class="demo-grid">
      <button class="demo-btn" data-role="admin">👑 أدمن</button>
      <button class="demo-btn" data-role="moderator">🛡 مودريتور</button>
      <button class="demo-btn" data-role="teacher">📖 معلم</button>
      <button class="demo-btn" data-role="student">🎓 طالب</button>
    </div>
    <p class="login-note">النظام دلوقتي شغال ببيانات وهمية للتجربة — هيتم ربطه بقاعدة بيانات حقيقية (Supabase) في الخطوة الجاية.</p>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="https://res.cloudinary.com/dvfx83gns/image/upload/v1787795512/%D9%82%D8%B1%D8%B7%D8%A8%D8%A9_gbn7xe.png" alt="قرطبة">
      <div><strong>قرطبة</strong><span>منصة المتابعة</span></div>
    </div>
    <div class="side-role" id="sideRoleLabel">لوحة التحكم</div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="sidebar-user">
      <div class="avatar" id="userAvatar">؟</div>
      <div class="who"><strong id="userName">—</strong><span id="userRoleText">—</span></div>
      <button class="logout-btn" id="logoutBtn" title="تسجيل الخروج">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h2 id="pageTitle">نظرة عامة</h2>
      <span class="date-pill" id="todayDate"></span>
    </div>
    <div class="content" id="content"><!-- pages injected here --></div>
  </div>
</div>

<!-- ============ MODAL: teacher logs evaluation ============ -->
<div class="modal-overlay" id="evalModal">
  <div class="modal">
    <h3>تسجيل تسميع</h3>
    <div class="field">
      <label>الطالب</label>
      <select id="evalStudent"></select>
    </div>
    <div class="field">
      <label>الورد (من - إلى)</label>
      <input type="text" id="evalWard" placeholder="مثال: سورة البقرة من آية ١ إلى ٢٠">
    </div>
    <div class="field">
      <label>التقييم</label>
      <select id="evalRating">
        <option value="ممتاز">ممتاز</option>
        <option value="جيد">جيد</option>
        <option value="يحتاج مراجعة">يحتاج مراجعة</option>
      </select>
    </div>
    <div class="field">
      <label>ملاحظات</label>
      <textarea id="evalNotes" rows="3" placeholder="ملاحظات المعلم..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="evalCancel">إلغاء</button>
      <button class="btn btn-primary" id="evalSave" style="flex:1;">حفظ التقييم</button>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   MOCK DATA LAYER
   شكل البيانات هنا مبني عشان يبقى قريب من جداول Supabase اللي هنعملها بعدين:
   users(id, name, role, email) / teachers(user_id, student_ids)
   students(user_id, teacher_id, program, progress_juz, current_ward, last_evaluation)
   sessions(id, student_id, teacher_id, datetime, platform, link, status)
   evaluations(id, student_id, teacher_id, date, ward, rating, notes)
   ===================================================================== */

    { id:'s3', name:'عبد الرحمن سعيد', teacher:'الشيخ أحمد فتحي', program:'أطفال', progress:3, lastRating:'يحتاج مراجعة' },

    { student:'مريم خالد', date:'٢٨ أغسطس', time:'٧:٣٠ م', platform:'Google Meet', link:'https://meet.google.com/demo', status:'upcoming' },
    { student:'عبد الرحمن سعيد', date:'٢٦ أغسطس', time:'٦:٠٠ م', platform:'Zoom', link:'#', status:'done' },
  ],
  evaluations: [
    { student:'يوسف أحمد', date:'٢٦ أغسطس', ward:'سورة الفاتحة كاملة', rating:'ممتاز', notes:'حفظ متقن وتلاوة سليمة.' },
    { student:'يوسف أحمد', date:'١٩ أغسطس', ward:'أواخر سورة الناس والفلق', rating:'جيد', notes:'يحتاج تثبيت أكتر على المخارج.' },
  ],
  complaints: [
    { from:'ولي أمر طالب', about:'تأخر معاد حصة', status:'تم الحل' },
    { from:'طالب', about:'طلب تغيير موعد الحصة الأسبوعية', status:'قيد المتابعة' },
  ]
};

const USERS = {
  admin:     { name:'محمد جمال', role:'admin', roleLabel:'أدمن', initial:'م' },
  moderator: { name:'هبة السيد', role:'moderator', roleLabel:'مودريتور', initial:'ه' },
  teacher:   { name:'الشيخ أحمد فتحي', role:'teacher', roleLabel:'معلم', initial:'أ' },
  student:   { name:'يوسف أحمد', role:'student', roleLabel:'طالب', initial:'ي' },
};

const NAV = {
  admin: [
    { id:'overview', label:'نظرة عامة', icon:'grid' },
    { id:'teachers', label:'المعلمين', icon:'book' },
    { id:'students', label:'الطلاب', icon:'users' },
    { id:'moderators', label:'المودريتورز', icon:'shield' },
    { id:'reports', label:'التقارير', icon:'chart' },
  ],
  moderator: [
    { id:'overview', label:'نظرة عامة', icon:'grid' },

/* ---------------- LOGIN HANDLERS ---------------- */
document.querySelectorAll('.demo-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> loginAs(btn.dataset.role));
});
document.getElementById('loginForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  // بيانات وهمية: أي إيميل/باسورد هيدخل كطالب تجريبي مبدئيًا
  loginAs('student');
});

function loginAs(role){
  currentRole = role;
  const u = USERS[role];
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('active');
  document.getElementById('userName').textContent = u.name;
  document.getElementById('userRoleText').textContent = u.roleLabel;
  document.getElementById('userAvatar').textContent = u.initial;
  document.getElementById('sideRoleLabel').textContent = 'لوحة ' + u.roleLabel;
  buildSidebar(role);
  const firstPage = NAV[role][0].id;
  renderPage(role, firstPage);
  document.getElementById('todayDate').textContent = new Date().toLocaleDateString('ar-EG', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
}

document.getElementById('logoutBtn').addEventListener('click', ()=>{
  document.getElementById('app').classList.remove('active');
  document.getElementById('loginScreen').style.display = 'flex';
  currentRole = null;
});

/* ---------------- SIDEBAR ---------------- */
function buildSidebar(role){
  const nav = document.getElementById('sideNav');
  nav.innerHTML = '';
  NAV[role].forEach((item,i)=>{
    const a = document.createElement('div');
    a.className = 'side-link' + (i===0 ? ' active' : '');
    a.dataset.page = item.id;
    a.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[item.icon]}</svg><span>${item.label}</span>`;
    a.addEventListener('click', ()=>{
      document.querySelectorAll('.side-link').forEach(l=>l.classList.remove('active'));
      a.classList.add('active');
      renderPage(role, item.id);
      document.getElementById('pageTitle').textContent = item.label;
    });
    nav.appendChild(a);
  });
  document.getElementById('pageTitle').textContent = NAV[role][0].label;
}

/* ---------------- PAGE RENDERING ---------------- */
function renderPage(role, pageId){
  const c = document.getElementById('content');
  c.innerHTML = PAGES[pageId] ? PAGES[pageId]() : '<p>الصفحة قيد الإنشاء.</p>';
  if(pageId === 't-eval') setupEvalPage();
  if(pageId === 't-students') setupTeacherStudentButtons();
}

function ratingBadge(r){
  if(r === 'ممتاز') return `<span class="badge badge-success">ممتاز</span>`;
  if(r === 'جيد') return `<span class="badge badge-warn">جيد</span>`;
  return `<span class="badge badge-danger">يحتاج مراجعة</span>`;
}

function statCard(icon, num, label){
  return `<div class="stat-card">
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[icon]}</svg></div>
    <div class="num">${num}</div>
    <div class="lbl">${label}</div>
  </div>`;
}

function sessionItem(s){
  const isDone = s.status === 'done';
  return `<div class="session-item">
    <div class="session-date"><b>${s.date.split(' ')[0]}</b><span>${s.date.split(' ')[1]||''}</span></div>
    <div class="session-info">
      <strong>${s.student}</strong>
      <span>${s.time} · ${s.platform}</span>
    </div>
    <a href="${s.link}" target="_blank" class="session-join ${isDone ? 'disabled' : ''}">${isDone ? 'انتهت' : 'انضمام'}</a>
  </div>`;
}

function progressRing(value, max){
  const pct = Math.round((value/max)*100);
  const r = 54, c = 2*Math.PI*r;
  const offset = c - (pct/100)*c;
  return `<div class="ring">
    <svg viewBox="0 0 130 130">
      <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--line)" stroke-width="12"/>
      <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--gold)" stroke-width="12" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
    </svg>
    <div class="ring-label"><b>${pct}%</b><span>من الختمة</span></div>
  </div>`;
}

function eyeIcon(){ return `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;stroke:var(--green-deep);"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>`; }
function warnIcon(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="#8A611E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;flex:none;"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>`; }

/* ---------------- EVALUATION MODAL ---------------- */
function setupEvalPage(){
  document.getElementById('openEvalModal').addEventListener('click', openEvalModal);
}
function setupTeacherStudentButtons(){
  document.querySelectorAll('.quick-eval').forEach(btn=>{
    btn.addEventListener('click', ()=> openEvalModal(btn.dataset.student));
  });
}
function openEvalModal(preselect){
  const sel = document.getElementById('evalStudent');
  sel.innerHTML = DB.students.filter(s=>s.teacher===USERS.teacher.name).map(s=>`<option ${s.name===preselect?'selected':''}>${s.name}</option>`).join('');
  document.getElementById('evalWard').value = '';
  document.getElementById('evalNotes').value = '';
  document.getElementById('evalModal').classList.add('active');
}
document.getElementById('evalCancel').addEventListener('click', ()=> document.getElementById('evalModal').classList.remove('active'));
document.getElementById('evalSave').addEventListener('click', ()=>{
  const student = document.getElementById('evalStudent').value;
  const ward = document.getElementById('evalWard').value || 'ورد غير محدد';
  const rating = document.getElementById('evalRating').value;
  const notes = document.getElementById('evalNotes').value;
  DB.evaluations.unshift({ student, date:'اليوم', ward, rating, notes });
  const s = DB.students.find(s=>s.name===student);
  if(s) s.lastRating = rating;
  document.getElementById('evalModal').classList.remove('active');
  renderPage('teacher', 't-eval');
});
