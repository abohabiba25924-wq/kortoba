<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3D28" />
      <stop offset="50%" stop-color="#0A2D1E" />
      <stop offset="100%" stop-color="#051C12" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C660" />
      <stop offset="50%" stop-color="#D89518" />
      <stop offset="100%" stop-color="#A27116" />
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1" />
      <stop offset="100%" stop-color="#E5AF36" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Islamic Geometric Border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.35" />
  <rect x="36" y="36" width="440" height="440" rx="82" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="8 6" />

  <!-- Corner Islamic Flourishes -->
  <g stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.6">
    <!-- Top Left -->
    <path d="M50 85 C 50 65, 65 50, 85 50" />
    <circle cx="85" cy="50" r="3" fill="#D89518" />
    <circle cx="50" cy="85" r="3" fill="#D89518" />
    <!-- Top Right -->
    <path d="M462 85 C 462 65, 447 50, 427 50" />
    <circle cx="427" cy="50" r="3" fill="#D89518" />
    <circle cx="462" cy="85" r="3" fill="#D89518" />
    <!-- Bottom Left -->
    <path d="M50 427 C 50 447, 65 462, 85 462" />
    <circle cx="85" cy="462" r="3" fill="#D89518" />
    <circle cx="50" cy="427" r="3" fill="#D89518" />
    <!-- Bottom Right -->
    <path d="M462 427 C 462 447, 447 462, 427 462" />
    <circle cx="427" cy="462" r="3" fill="#D89518" />
    <circle cx="462" cy="427" r="3" fill="#D89518" />
  </g>

  <!-- Central Star Motif Background Glow -->
  <circle cx="256" cy="226" r="140" fill="url(#goldGrad)" opacity="0.08" filter="url(#glow)" />

  <!-- 8-Point Islamic Star (Khatim) Ornament behind Quran -->
  <g transform="translate(256, 222)" stroke="url(#goldGrad)" stroke-width="1.8" fill="rgba(216,149,24,0.04)">
    <rect x="-105" y="-105" width="210" height="210" rx="14" />
    <rect x="-105" y="-105" width="210" height="210" rx="14" transform="rotate(45)" />
    <circle cx="0" cy="0" r="118" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="4 4" fill="none" opacity="0.4" />
  </g>

  <!-- Holy Quran Graphic (Open Book / Mushaf) -->
  <g filter="url(#shadow)">
    <!-- Stand / Rihal Base -->
    <path d="M190 310 L256 270 L322 310 L302 334 L256 304 L210 334 Z" fill="url(#goldGrad)" opacity="0.85" />
    
    <!-- Left Page -->
    <path d="M252 165 C215 160 160 172 135 186 C129 189 126 195 126 202 L126 280 C126 287 132 292 139 290 C162 278 214 266 252 272 Z" 
          fill="#FDFBF7" stroke="url(#goldGrad)" stroke-width="2.5" />
    <!-- Left Page Inner Lines (Ayahs) -->
    <path d="M152 204 Q190 196 234 200 M152 222 Q190 214 234 218 M152 240 Q190 232 234 236 M152 258 Q190 250 234 254" 
          stroke="#0F3D28" stroke-width="2" stroke-linecap="round" opacity="0.32" />

    <!-- Right Page -->
    <path d="M260 165 C297 160 352 172 377 186 C383 189 386 195 386 202 L386 280 C386 287 380 292 373 290 C350 278 298 266 260 272 Z" 
          fill="#FDFBF7" stroke="url(#goldGrad)" stroke-width="2.5" />
    <!-- Right Page Inner Lines (Ayahs) -->
    <path d="M278 200 Q322 196 360 204 M278 218 Q322 214 360 222 M278 236 Q322 232 360 240 M278 254 Q322 250 360 258" 
          stroke="#0F3D28" stroke-width="2" stroke-linecap="round" opacity="0.32" />

    <!-- Spine / Middle Ribbon -->
    <path d="M254 162 L258 162 L258 274 L254 274 Z" fill="#D89518" />
    <path d="M256 274 L256 314 L262 318 L256 324 L250 318 Z" fill="#F3C660" />
  </g>

  <!-- Stylized Arabic Letter Qaf (ق) / Radiant Emblem -->
  <g transform="translate(256, 120)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="url(#goldGrad)" />
    <!-- Two Dots of Qaf -->
    <circle cx="-9" cy="-38" r="6" fill="#FFF3D1" />
    <circle cx="9" cy="-38" r="6" fill="#FFF3D1" />
    <!-- Center Crescent -->
    <path d="M-10 4 C-8 14 8 14 10 4 C10 -6 -10 -6 -10 4 Z" fill="#0A2D1E" />
  </g>

  <!-- Typography: قُرْطُبَة / مَنَصَّة قَاف -->
  <text x="256" y="388" font-family="'Amiri', 'Cairo', 'Traditional Arabic', serif" font-size="46" font-weight="bold" fill="url(#goldSoft)" text-anchor="middle" letter-spacing="1">
    قَاف قُرْطُبَة
  </text>
  <text x="256" y="424" font-family="'Cairo', sans-serif" font-size="20" font-weight="600" fill="#E2ECE6" opacity="0.85" text-anchor="middle" letter-spacing="3">
    مَنَصَّة تَعْلِيم القُرْآن الكَرِيم
  </text>
</svg>
